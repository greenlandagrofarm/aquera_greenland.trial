<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AQUERA - MANAJEMEN PERIKANAN TERINTEGRASI</title>

    <meta property="og:title" content="AQUERA - BY GREENLAND">
    <meta property="og:description" content="Webapp Manajemen Perikanan Terintegrasi, Praktis & Profesional.">
    <meta property="og:type" content="website">
    
    <meta property="og:url" content="https://github.com/greenlandagrofarm/aquera_greenland.trial/">
    
    <meta property="og:image" content="https://i.ibb.co.com/ynwgTZfj/aquera.png">
    
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            /* Background layar aplikasi utama putih */
            background-color: #ffffff;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        /* Loader dengan Logo dan Teks Biru Navy Modern */
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Menggunakan Flexbox agar susunan logo dan teks tegak lurus ke bawah */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px; /* Jarak vertikal antara gambar logo dan teks tulisan */
            
            /* Warna Biru Navy */
            color: #1e3a8a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 0.1em;
            z-index: 2;
        }

        /* Mengatur dimensi gambar logo loader */
        #loader img {
            width: 140px; /* Lebar logo bisa disesuaikan, misal 140px agar proposional */
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="loader">
        <img src="https://i.ibb.co.com/ynwgTZfj/aquera.png" alt="Logo AQUERA">
        <div>Memuat AQUERA Mohon Tunggu..Refresh Jika Koneksi Terputus..</div>
    </div>
    
    <iframe 
        src="https://script.google.com/macros/s/AKfycbzMmnts09xg8qK91k81TTLNENv24zQY4QaSyuhawuD55qyFD_77pTDmawrGr5HgM2cm/exec" 
        onload="document.getElementById('loader').style.display='none';">
    </iframe>

</body>
</html>
